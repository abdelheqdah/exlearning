<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>ExLearn | Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages or static hosts
      var path = window.location.pathname;
      var query = window.location.search;
      var hash = window.location.hash;
      window.location.replace('/?p=' + encodeURIComponent(path + query + hash));
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/">ExLearn</a>...</p>
  </body>
</html>
